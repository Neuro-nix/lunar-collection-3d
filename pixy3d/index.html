const canvas=document.querySelector('canvas');
const status=document.querySelector('#status');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(27,1,0.01,100);

renderer.outputColorSpace=THREE.SRGBColorSpace;

renderer.setClearColor(0x000000,0);

const key=new THREE.DirectionalLight(0xffffff,2.3);
key.position.set(-2.5,4,5);scene.add(key);
const fill=new THREE.DirectionalLight(0xa6fa08,0.55);
fill.position.set(3,1,-2);scene.add(fill);

const pivot=new THREE.Group();scene.add(pivot);
const bones=new Map(),rest=new Map();
let character=null,baseHeight=0;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const loader=new GLTFLoader();
loader.load('./pixy.glb',gltf=>{
  character=gltf.scene;
  const box=new THREE.Box3().setFromObject(character);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  baseHeight=Math.max(size.y,0.01);
  character.position.set(-center.x,-box.min.y,-center.z);
  character.scale.setScalar(1.68/baseHeight);
  pivot.add(character);
  character.traverse(node=>{
    if(node.isBone){
      const name=node.name.split(':').pop();
      const key=name.replace(/^mixamorig/i,'').replace(/[^a-z0-9]/gi,'').toLowerCase();
      bones.set(key,node);
      rest.set(key,{rotation:node.rotation.clone(),quaternion:node.quaternion.clone(),position:node.position.clone()});
    }
    if(node.isMesh){node.frustumCulled=false;node.castShadow=false;node.receiveShadow=false}
  });
  character.updateMatrixWorld(true);
  const headBone=bones.get('head');
  const eyelids=[];
  if(headBone){
    const lidMat=new THREE.MeshStandardMaterial({color:0xc9ed67,roughness:0.94,metalness:0});
    const eyeCenters=[[-0.145,1.225,0.535],[0.145,1.225,0.535]];
    eyeCenters.forEach(([x,y,z])=>{
      const lid=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),lidMat);
      lid.position.copy(headBone.worldToLocal(new THREE.Vector3(x,y,z)));
      lid.scale.set(0.105,0.053,0.012);lid.visible=false;
      headBone.add(lid);eyelids.push(lid);
    });
  }
  camera.position.set(0,0.93,6.2);
  camera.lookAt(0,0.84,0);
  applyWave(0);
  status.textContent='';
},undefined,error=>{
  status.textContent='Не удалось загрузить Пикси';
  console.error('Pixy GLB load failed',error);
});

function bonePose(name,apply){
  const key=name.replace(/^mixamorig/i,'').replace(/[^a-z0-9]/gi,'').toLowerCase();
  const node=bones.get(key),base=rest.get(key);
  if(node&&base)apply(node,base);
}
function boneWorldAxis(name,axis,angle){
  const key=name.replace(/^mixamorig/i,'').replace(/[^a-z0-9]/gi,'').toLowerCase();
  const node=bones.get(key),base=rest.get(key);
  if(!node||!base||!node.parent)return;
  const parentQ=node.parent.getWorldQuaternion(new THREE.Quaternion());
  const worldDelta=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(...axis),angle);
  const localDelta=parentQ.clone().invert().multiply(worldDelta).multiply(parentQ);
  node.quaternion.copy(localDelta.multiply(new THREE.Quaternion().setFromEuler(base.rotation)));
}

const waveA=new THREE.Quaternion(),waveB=new THREE.Quaternion();
function applyWave(seconds){
  const time=((seconds%3.83333)+3.83333)%3.83333;
  for(const [name,track] of Object.entries(pixyWaveData)){
    const key=name.split(':').pop().replace(/[^a-z0-9]/gi,'').toLowerCase();
    const bone=bones.get(key);if(!bone)continue;
    const times=track.times,values=track.values;
    let hi=0;while(hi<times.length&&times[hi]<time)hi++;
    const a=Math.max(0,hi-1),b=Math.min(times.length-1,hi);
    const span=times[b]-times[a],alpha=span>0?THREE.MathUtils.clamp((time-times[a])/span,0,1):0;
    waveA.fromArray(values,a*4);waveB.fromArray(values,b*4);
    bone.quaternion.slerpQuaternions(waveA,waveB,alpha);
  }
}
const clock=new THREE.Clock();

  if(canvas.width!==w||canvas.height!==h){renderer.setSize(rect.width,rect.height,false)}

}
